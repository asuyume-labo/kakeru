<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>KAKERU わたしのいまここ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%2314212b%22/%3E%3Cpath d=%22M6 10l10 4 10-4v3l-10 4-10-4zm0 6l10 4 10-4v3l-10 4-10-4z%22 fill=%22%23f2c46a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a scoring sheet; a sticky progress bar while answering, sheet sections stacked after. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#14212b; --muted:#566775; --line:#d6dee4; --soft:#e8eef2;
  --accent:#2453a6; --accent-soft:#e3ebf8;
  --good:#2b8653; --good-soft:#e2f2e8; --warn:#a77406; --warn-soft:#f8efda; --crit:#5b5bb0; --crit-soft:#e9e9f7;
  --band:#14212b; --band-ink:#ffffff; --band-muted:#a9b7c2; --band-line:#3a4b58; --gold:#f2c46a;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#080d11; --band-line:#2a3946; --bg:#0e161c; --surface:#16212a; --ink:#e5ecf1; --muted:#97a8b5; --line:#2a3946; --soft:#1d2a34;
  --accent:#7aa5ec; --accent-soft:#1e2d45;
  --good:#5cc28a; --good-soft:#173226; --warn:#e3ae4b; --warn-soft:#3a2e15; --crit:#a3a3f0; --crit-soft:#25254a; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#080d11; --band-line:#2a3946; --bg:#0e161c; --surface:#16212a; --ink:#e5ecf1; --muted:#97a8b5; --line:#2a3946; --soft:#1d2a34;
  --accent:#7aa5ec; --accent-soft:#1e2d45;
  --good:#5cc28a; --good-soft:#173226; --warn:#e3ae4b; --warn-soft:#3a2e15; --crit:#a3a3f0; --crit-soft:#25254a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brandbar{background:var(--band);color:var(--band-ink);margin-bottom:8px}
.brandbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
.brandbar .left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brandbar img{height:22px;width:auto;max-width:100%;display:block}
.product{font-family:var(--f-num);font-weight:600;font-size:20px;letter-spacing:.28em;color:var(--band-ink);border-left:1px solid var(--band-line);padding-left:14px;line-height:1}
.brandbar .proto{color:var(--band-muted);border-color:var(--band-line)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:26px;font-weight:900}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:12px 22px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:20px 12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.04em}
.brand span{color:var(--accent)}
.proto{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}

/* intro */
.hero{padding-block:16px 8px}
.hero p{max-width:60ch;margin-top:10px}
.hero-title{font-size:34px;letter-spacing:.06em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero-sub{font-size:16px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:4px}
.facts div{border-top:2px solid var(--ink);padding-top:8px}
.facts b{display:block;font-family:var(--f-num);font-size:20px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:4px;flex:none;accent-color:var(--accent)}
ul.plain{margin:0;padding-left:1.2em}

/* attributes */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field input,.field select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}

/* question pages */
.progress{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qlegend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.q{padding-block:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.q:first-of-type{border-top:none}
.qtext{font-weight:500}
.qno{font-family:var(--f-num);color:var(--muted);font-size:12px;margin-right:8px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:1.25}
.scale button b{font-family:var(--f-num);font-size:16px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px}
.yn button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font-weight:700}
.yn button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* result */
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.meta{font-size:12px;color:var(--muted);text-align:right}
.alert{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:10px;padding:16px 18px}
.alert h3{color:var(--ink);font-size:15px}
.summary{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.type-name{font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1.2}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.kpi{border-top:1px solid var(--line);padding-top:8px}
.kpi .v{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.radar-box{overflow-x:auto}
.radar-box svg{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mini-list div{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}
.msg{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.msg .why{font-size:13px;color:var(--muted)}
.msg .tag{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.sdt{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.sdt-row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:13px}
.sdt-track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.sdt-track i{display:block;height:100%;background:var(--muted)}
.sdt-row.low .sdt-track i{background:var(--accent)}
.sdt-row.low span:first-child{font-weight:700;color:var(--accent)}
.cat-table{width:100%;border-collapse:collapse;font-size:14px}
.cat-table th,.cat-table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cat-table th{font-size:12px;color:var(--muted);font-weight:500}
.cat-table td.sc{font-family:var(--f-num);text-align:right;white-space:nowrap}
.cat-name{font-weight:700;white-space:nowrap}
.op{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.op-k{font-family:var(--f-num);color:var(--accent);font-weight:600}
.care{counter-reset:c;display:flex;flex-direction:column;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.care li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.care li::before{counter-increment:c;content:counter(c);font-family:var(--f-num);font-weight:600;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px}
.quote{background:var(--soft);border-radius:8px;padding:12px 14px}
.notes{font-size:13px;color:var(--muted)}
.tel{font-family:var(--f-num);user-select:all}

/* debug */
details.debug{border:1px dashed var(--muted);border-radius:10px;padding:14px 16px;background:var(--surface)}
details.debug summary{cursor:pointer;font-weight:700}
.dbg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.dbg-grid button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;text-align:left;font-size:13px}
.dbg-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.dbg-table td,.dbg-table th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.scroll{overflow-x:auto}
textarea{width:100%;font-family:var(--f-num);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}

@media (max-width:620px){
  .facts{grid-template-columns:1fr 1fr 1fr}
  .fields,.summary,.two{grid-template-columns:1fr}
  .type-name{font-size:26px}
  .cat-table .cmt-col{display:none}
  .cat-table td.cmt{display:block}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>

/* ---------- データ（サーバーから受け取る） ---------- */

function finish(){

  const payload={attrs:state.attrs,answers:state.a,safety:state.s,password:state.password,consentAt:state.consentAt};
  api('submit', {payload}).then(res=>{
    state.sending=false;

    state.result=res.result; state.id=res.result.id; state.date=res.result.date; state.mailed=res.mailed;

}

/* ---------- レーダー ---------- */
function radar(s){
  const W=520,H=440,cx=260,cy=220,R=150,n=10;
  const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(ang)*R*v/100, cy+Math.sin(ang)*R*v/100]};
  const ring=v=>Array.from({length:n},(_,i)=>pt(i,v).join(',')).join(' ');
  const poly=Array.from({length:n},(_,i)=>pt(i,s[i+1]).join(',')).join(' ');
  let g='';
  g+=`<polygon points="${ring(100)}" fill="var(--soft)" stroke="var(--line)"/>`;
  g+=`<polygon points="${ring(70)}" fill="none" stroke="var(--good)" stroke-dasharray="4 4" stroke-opacity=".7"/>`;
  g+=`<polygon points="${ring(50)}" fill="none" stroke="var(--crit)" stroke-dasharray="4 4" stroke-opacity=".7"/>`;
  for(let i=0;i<n;i++){const [x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;}
  g+=`<polygon points="${poly}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2"/>`;
  for(let i=0;i<n;i++){
    const v=s[i+1],[x,y]=pt(i,v),b=band(v)[1];
    g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--${b})" stroke="var(--surface)" stroke-width="1.5"/>`;
    const [lx,ly]=pt(i,122); const anchor=Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="12.5" fill="var(--ink)" font-family="var(--f-body)">${MARK[i+1]} ${CATS[i+1].name}</text>`;
    g+=`<text x="${lx}" y="${ly+16}" text-anchor="${anchor}" font-size="12" fill="var(--muted)" font-family="var(--f-num)">${v}</text>`;
  }
  g+=`<text x="${cx+4}" y="${cy-R*0.70-4}" font-size="10.5" fill="var(--good)" font-family="var(--f-num)">70</text>`;
  g+=`<text x="${cx+4}" y="${cy-R*0.50-4}" font-size="10.5" fill="var(--crit)" font-family="var(--f-num)">50</text>`;
  return `<svg viewBox="-60 0 ${W+120} ${H}" role="img" aria-label="10カテゴリのレーダーチャート">${g}</svg>`;
}
function quad(r){
  // 横：環境・成果の充実度（①〜⑥平均）、縦：内なるエネルギー（⑦⑧⑩平均）。どちらも右・上ほど良い
  const W=260,H=200,x0=30,y0=10,w=220,h=160;
  const bx=x0+r.envMean/100*w, by=y0+(1-r.resMean/100)*h;
  const mx=x0+0.6*w, my=y0+0.4*h;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="タイプ判定の位置" style="width:100%;max-width:280px;height:auto">
   <rect x="${x0}" y="${y0}" width="${mx-x0}" height="${my-y0}" fill="var(--warn-soft)"/>
   <rect x="${mx}" y="${y0}" width="${x0+w-mx}" height="${my-y0}" fill="var(--good-soft)"/>
   <rect x="${x0}" y="${my}" width="${mx-x0}" height="${y0+h-my}" fill="var(--crit-soft)"/>
   <rect x="${mx}" y="${my}" width="${x0+w-mx}" height="${y0+h-my}" fill="var(--warn-soft)"/>
   <rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="var(--line)"/>
   <text x="${x0+6}" y="${y0+16}" font-size="11" fill="var(--warn)">挑戦</text>
   <text x="${x0+w-6}" y="${y0+16}" font-size="11" text-anchor="end" fill="var(--good)">充実</text>
   <text x="${x0+6}" y="${y0+h-6}" font-size="11" fill="var(--crit)">回復優先</text>
   <text x="${x0+w-6}" y="${y0+h-6}" font-size="11" text-anchor="end" fill="var(--warn)">充電</text>
   <circle cx="${bx}" cy="${by}" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
   <text x="${x0+w/2}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">環境・成果の充実度 低 → 高</text>
   <text x="12" y="${y0+h/2}" font-size="10.5" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 12 ${y0+h/2})">内なるエネルギー 低 → 高</text>
  </svg>`;
}
